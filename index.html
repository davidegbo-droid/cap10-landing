<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capital-10 | Professional College Soccer Recruiting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #1a365d;
            --primary-light: #2c5282;
            --accent: #38b2ac;
            --accent-dark: #319795;
            --gold: #d69e2e;
            --text: #2d3748;
            --text-light: #718096;
            --bg: #ffffff;
            --bg-alt: #f7fafc;
            --border: #e2e8f0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; color: var(--text); line-height: 1.6; }
        h1, h2, h3, h4 { font-family: 'Playfair Display', serif; font-weight: 700; }
        nav {
            position: fixed; top: 0; width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid var(--border);
            padding: 1rem 0;
        }
        .nav-container {
            max-width: 1200px; margin: 0 auto; padding: 0 2rem;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo {
            font-size: 1.8rem; font-weight: 800; color: var(--primary);
            text-decoration: none; display: flex; align-items: center; gap: 0.5rem;
        }
        .logo-icon { color: var(--accent); }
        .btn-nav {
            background: var(--primary); color: white;
            padding: 0.75rem 1.5rem; border-radius: 8px;
            text-decoration: none; font-weight: 600;
        }
        .hero {
            min-height: 100vh; display: flex; align-items: center;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            padding-top: 80px;
        }
        .hero-container {
            max-width: 1200px; margin: 0 auto; padding: 4rem 2rem;
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 4rem; align-items: center;
        }
        .hero-content { color: white; }
        .hero-badge {
            display: inline-block; background: rgba(56, 178, 172, 0.2);
            border: 1px solid var(--accent); color: var(--accent);
            padding: 0.5rem 1rem; border-radius: 50px;
            font-size: 0.875rem; font-weight: 600; margin-bottom: 1.5rem;
        }
        .hero h1 { font-size: 3.5rem; margin-bottom: 1.5rem; line-height: 1.1; }
        .hero h1 span { color: var(--accent); }
        .hero-subtitle { font-size: 1.25rem; opacity: 0.9; margin-bottom: 2rem; }
        .waitlist-cta {
            padding: 6rem 0;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            text-align: center;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 2rem; }
        #waitlist-form {
            max-width: 600px; margin: 2rem auto 0;
            background: white; padding: 2rem;
            border-radius: 16px; color: var(--text);
        }
        .form-group { margin-bottom: 1.5rem; text-align: left; }
        .form-group input, .form-group select {
            width: 100%; padding: 0.75rem;
            border: 2px solid var(--border);
            border-radius: 8px;
        }
        .btn-submit {
            width: 100%; background: var(--accent);
            color: white; border: none;
            padding: 1rem; border-radius: 8px;
            font-weight: 600; font-size: 1.125rem;
            cursor: pointer;
        }
        .success-message {
            display: none; background: #48bb78; color: white;
            padding: 1rem; border-radius: 8px; margin-top: 1rem;
        }
        footer { background: var(--primary); color: white; padding: 2rem 0; text-align: center; }
        @media (max-width: 768px) {
            .hero-container { grid-template-columns: 1fr; }
            .hero h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

<nav>
    <div class="nav-container">
        <a href="#" class="logo"><i class="fas fa-futbol logo-icon"></i>Capital-10</a>
        <a href="#waitlist" class="btn-nav">Join Waitlist</a>
    </div>
</nav>

<section class="hero">
    <div class="hero-container">
        <div class="hero-content">
            <div class="hero-badge">🚀 Launching Spring 2026</div>
            <h1>The <span>Professional</span> Way to Navigate College Soccer Recruiting</h1>
            <p class="hero-subtitle">Built by a former pro player and coach.</p>
            <a href="#waitlist" class="btn-nav" style="padding: 1rem 2rem;">Join the Waitlist — Get 50% Off</a>
        </div>
        <div class="hero-visual">
            <i class="fas fa-user-circle"></i>
            <p>Your Professional Photo Here</p>
        </div>
    </div>
</section>

<section class="waitlist-cta" id="waitlist">
    <div class="container">
        <h2>Join the Waitlist</h2>
        <form id="waitlist-form" action="https://formspree.io/f/xnjbzdwo" method="POST">
            <div class="form-group">
                <label>Your Name *</label>
                <input type="text" name="parentName" required>
            </div>
            <div class="form-group">
                <label>Email *</label>
                <input type="email" name="email" required>
            </div>
            <button type="submit" class="btn-submit">Join Waitlist</button>
        </form>
        <div class="success-message" id="success-message">✅ You're on the list!</div>
    </div>
</section>

<footer>
    <div class="container">
        <p>&copy; 2026 Capital-10. All rights reserved.</p>
    </div>
</footer>

<script>
document.getElementById('waitlist-form').addEventListener('submit', function() {
    setTimeout(function() {
        document.getElementById('waitlist-form').style.display = 'none';
        document.getElementById('success-message').style.display = 'block';
    }, 500);
});
</script>

</body>
</html>
